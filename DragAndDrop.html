<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag And Drop API</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #1d322b;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #273e2c;
            font-size: 36px;
            margin-bottom: 50px;
        }

        .container-row {
            max-width: 1100px;
            margin: 0 auto 50px auto;
            border: 2px solid #21372d;
            display: flex;
            align-items: center;
            background: #fff;
            padding: 10px;
            gap: 10px;
            justify-content: space-between;
        }

        .dropzone {
            flex: 1;
            height: 60px;
            border: 1px solid #16241d;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .draggable {
            width: 140px;
            height: 45px;
            background-color: #1c2d21;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            border-radius: 4px;
            z-index: 2;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .back-link {
            display: block;
            text-align: left;
            max-width: 1100px;
            margin: 20px auto 0 auto;
            color: #17281e;
            font-weight: bold;
            text-decoration: underline;
            font-size: 16px;
        }

        .back-link:hover {
            color: #bdbdbd;
        }
    </style>
</head>
<body>

    <h1>Drag And Drop API</h1>

    <!-- TOP ROW -->
    <div class="container-row">
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="draggable" id="drag1" draggable="true" ondragstart="drag(event)">Drag1</div>
        </div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="draggable" id="drag2" draggable="true" ondragstart="drag(event)">Drag2</div>
        </div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="draggable" id="drag3" draggable="true" ondragstart="drag(event)">Drag3</div>
        </div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <div class="draggable" id="drag4" draggable="true" ondragstart="drag(event)">Drag4</div>
        </div>
    </div>

    <!-- BOTTOM ROW -->
    <div class="container-row">
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        <div class="dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
    </div>


    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var draggedElement = document.getElementById(data);
            
            // Find the closest dropzone box
            var dropzone = ev.target.closest('.dropzone');
            
            // Only drop if the target box is empty
            if (dropzone && dropzone.children.length === 0) {
                dropzone.appendChild(draggedElement);
            }
        }
    </script>
</body>
</html>
